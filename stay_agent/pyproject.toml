[project]
name = "stay-agent"
version = "0.1.0"
description = "Airbnb sensor agent: the stay sensor posts readings, Claude writes the messages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic]>=2.54",
    # anthropic 2.x turned BetaMessageParam into a Union, which pydantic-ai 2.54 still
    # calls as a TypedDict ("Cannot instantiate typing.Union"). Lift once pydantic-ai catches up.
    "anthropic>=1.9,<2",
    "tzdata",
]

[project.scripts]
stay-agent = "stay_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
device = ["atech"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
