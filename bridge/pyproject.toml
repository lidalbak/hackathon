[project]
name = "agent-controller-bridge"
version = "0.1.0"
description = "PC bridge between AI coding agents and the Agent Controller board"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "atech",
]

[project.scripts]
agent-controller = "agent_controller.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
voice = ["faster-whisper", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
